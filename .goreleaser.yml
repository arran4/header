version: 2

project_name: header

before:
  hooks:
    - go mod tidy

builds:
  - id: header
    binary: header
    main: ./cmd/header
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64, "386"]
    ignore:
      - goos: darwin
        goarch: "386"
    env:
      - CGO_ENABLED=0

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - README.md
      - SECURITY.md

checksum:
  name_template: checksums.txt

nfpms:
  - id: linux-packages
    package_name: header
    vendor: Arran4
    homepage: https://github.com/arran4/header
    maintainer: Arran Ubels
    description: Extracts OpenGraph, Twitter and YouTube info from a given URL to display nicely in the terminal.
    license: MIT
    formats:
      - deb
      - rpm
      - apk
      - archlinux
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/header/LICENSE
      - src: THIRD_PARTY_NOTICES.md
        dst: /usr/share/licenses/header/THIRD_PARTY_NOTICES.md
    section: default
    priority: optional

homebrew_casks:
  - description: Extract and inspect web metadata from your terminal.
    homepage: https://github.com/arran4/header
    repository:
      owner: arran4
      name: homebrew-tap
      branch: "{{.ProjectName}}-{{.Version}}"
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        draft: false
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
