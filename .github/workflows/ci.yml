# Agent rules for generation:
# https://arran4.github.io/blog/post/2026/006-github-ci-and-deploy/
# Built using this post as a reference/guide.
name: CI/CD

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
      - 'v*.*.*'
      - 'v*.*.*-rc*'
      - 'v*.*.*-beta*'
      - 'test-*'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode"
        required: true
        default: "lint-fix"
        type: choice
        options:
          - lint-fix
          - build
          - release-major
          - release-minor
          - release-patch
          - release-retry
          - release-test
          - release-rc
          - release-alpha
          - monthly-maintenance
      release_version_override:
        description: "Explicit existing tag for release-retry; optional for new releases"
        required: false
        default: ""
        type: string
      allow_prs:
        description: "Allow automation to open pull requests"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '0 19 1 * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  route:
    name: Route event
    runs-on: ubuntu-latest
    outputs:
      run_code_checks: ${{ steps.route.outputs.run_code_checks }}
      run_pr_meta_checks: ${{ steps.route.outputs.run_pr_meta_checks }}
      run_cleanup: ${{ steps.route.outputs.run_cleanup }}
      run_release: ${{ steps.route.outputs.run_release }}
      is_monthly: ${{ steps.route.outputs.is_monthly }}
      is_nightly: ${{ steps.route.outputs.is_nightly }}
    steps:
      - id: route
        shell: bash
        run: |
          set -euo pipefail

          run_code_checks=false
          run_pr_meta_checks=false
          run_cleanup=false
          run_release=false
          is_monthly=false
          is_nightly=false

          case "${{ github.event_name }}" in
            push)
              run_code_checks=true
              ;;
            pull_request)
              if [[ "${{ github.event.action }}" == "closed" ]]; then
                run_cleanup=true
              else
                run_pr_meta_checks=true
                run_code_checks=true
              fi
              ;;
            release)
              run_release=true
              ;;
            workflow_dispatch)
              run_code_checks=true
              if [[ "${{ inputs.mode }}" == release-* ]]; then
                run_release=true
              fi
              if [[ "${{ inputs.mode }}" == "monthly-maintenance" ]]; then
                is_monthly=true
              fi
              if [[ "${{ inputs.mode }}" == "lint-fix" ]]; then
                is_nightly=true
              fi
              ;;
            schedule)
              run_code_checks=true
              if [[ "${{ github.event.schedule }}" == "0 19 1 * *" ]]; then
                is_monthly=true
              fi
              ;;
          esac

          echo "run_code_checks=$run_code_checks" >> "$GITHUB_OUTPUT"
          echo "run_pr_meta_checks=$run_pr_meta_checks" >> "$GITHUB_OUTPUT"
          echo "run_cleanup=$run_cleanup" >> "$GITHUB_OUTPUT"
          echo "run_release=$run_release" >> "$GITHUB_OUTPUT"
          echo "is_monthly=$is_monthly" >> "$GITHUB_OUTPUT"
          echo "is_nightly=$is_nightly" >> "$GITHUB_OUTPUT"

  golangci:
    name: lint
    needs: [route]
    if: ${{ needs.route.outputs.run_code_checks == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  go-test:
    name: Go lint/test (${{ matrix.os }})
    needs: [route, golangci]
    if: ${{ needs.route.outputs.run_code_checks == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify generated files
        run: |
          go generate ./...
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Verify release version rules
        run: bash .github/scripts/test-prepare-release.sh
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Validate release configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.19.0
          args: check

  goreleaser:
    name: GoReleaser
    needs: [route, go-test]
    if: ${{ (((github.event_name == 'push') && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && startsWith(inputs.mode, 'release-'))) }}
    runs-on: ubuntu-latest
    concurrency:
      group: header-release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select existing tagged draft for release retry
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'release-retry' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_version_override }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || {
            echo '::error::Retry dispatch must run from main'; exit 1;
          }
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo '::error::An existing vMAJOR.MINOR.PATCH tag is required'; exit 1;
          }
          release_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag and .draft == true) | .id')
          [[ "$release_id" =~ ^[0-9]+$ ]] || {
            echo "::error::Release $TAG must already exist as one unpublished draft"; exit 1;
          }
          tag_commit=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          git switch --detach "$tag_commit"
          [[ "$(git rev-parse HEAD)" == "$tag_commit" ]] || exit 1

          # Use the original release's source/build configuration; add only
          # GoReleaser draft-resume options without dirtying its tagged tree.
          if grep -q '^release:' .goreleaser.yml; then
            echo '::error::Tagged config already has a release policy; review before retry'; exit 1
          fi
          cp .goreleaser.yml "$RUNNER_TEMP/header-retry.goreleaser.yml"
          cat >> "$RUNNER_TEMP/header-retry.goreleaser.yml" <<'YAML'

          release:
            draft: true
            use_existing_draft: true
            replace_existing_artifacts: true
            mode: keep-existing
          YAML

          # GitHub documents incomplete "starter" assets as safe to delete.
          # Leave every fully uploaded asset untouched until GoReleaser can
          # replace collisions and issue a consistent new checksums.txt.
          while IFS= read -r asset_id; do
            [[ "$asset_id" =~ ^[0-9]+$ ]] || exit 1
            echo "Removing incomplete draft asset ID $asset_id"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          done < <(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" |
            jq -r '.[] | select(.state == "starter") | .id')
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Prepare semantic version tag for manual release
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'release-major' || inputs.mode == 'release-minor' || inputs.mode == 'release-patch') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_VERSION_OVERRIDE: ${{ inputs.release_version_override }}
        run: bash .github/scripts/prepare-release.sh "$RELEASE_MODE" "$RELEASE_VERSION_OVERRIDE"
      - name: Select GoReleaser arguments
        id: release-args
        shell: bash
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          args='release --clean'
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            case "$RELEASE_MODE" in
              release-test|release-rc|release-alpha) args+=' --snapshot' ;;
            esac
          fi
          if [[ "$EVENT_NAME" == workflow_dispatch && "$RELEASE_MODE" == release-retry ]]; then
            # No tap changes while repairing an already-created GitHub release.
            args+=" --skip=homebrew --config=$RUNNER_TEMP/header-retry.goreleaser.yml"
          elif [[ -z "$TAP_GITHUB_TOKEN" ]]; then
            echo 'TAP_GITHUB_TOKEN unavailable: skipping Homebrew publishing'
            args+=' --skip=homebrew'
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.19.0
          args: ${{ steps.release-args.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

      - name: Verify assets and publish resumed draft
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'release-retry' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_version_override }}
        run: |
          set -euo pipefail
          release_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag and .draft == true) | .id')
          [[ "$release_id" =~ ^[0-9]+$ ]] || exit 1
          assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100")
          jq -e 'length == 21 and all(.[]; .state == "uploaded")' <<< "$assets" >/dev/null || {
            echo '::error::Release assets not fully uploaded (expected 21)'
            jq -r '.[] | [.name, .state] | @tsv' <<< "$assets"
            exit 1
          }

          mkdir -p "$RUNNER_TEMP/header-release-verify"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/header-release-verify"
          (cd "$RUNNER_TEMP/header-release-verify" && sha256sum -c checksums.txt)

          # Only publish after all expected artifacts were downloaded and checked.
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          [[ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" == false ]]
