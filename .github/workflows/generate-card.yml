name: Generate Header Card

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/header-card.go'
      - '.github/workflows/generate-card.yml'
      - 'internal/cli/card.go'
      - 'internal/cli/cards/**'
  workflow_dispatch:
    inputs:
      card_type:
        description: 'Type of card to generate (basic or darkmode)'
        required: true
        default: 'basic'
        type: choice
        options:
          - basic
          - darkmode

permissions:
  contents: read

jobs:
  generate-card:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Generate Card
        env:
          CARD_TYPE: ${{ inputs.card_type || 'basic' }}
        run: go run ./.github/scripts/header-card.go --type "$CARD_TYPE"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "docs: regenerate header-card.png"
          title: "docs: Update header-card.png"
          body: "Automated PR to update the `header-card.png` preview in the README after changes to the card generation logic."
          branch: "update-header-card"
          add-paths: header-card.png
